<!DOCTYPE html>
<html>
<head>
    <title>Decrypt Image</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">🔓 Decrypt Image</h2>

    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow">

        <div class="mb-3">
            <label>Encrypted Image</label>
            <input type="file" name="enc_image" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Key File</label>
            <input type="file" name="key_file" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button class="btn btn-success">Decrypt</button>
    </form>

    <div class="mt-3">
        <a href="/" class="btn btn-secondary">Back</a>
    </div>
</div>

</body>
</html>
