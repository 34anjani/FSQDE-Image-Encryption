<!DOCTYPE html>
<html>
<head>
    <title>FSQDE Encryption</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">🔐 FSQDE Image Encryption</h2>

    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow">

        <div class="mb-3">
            <label>Upload Image</label>
            <input type="file" name="image" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Security Mode</label>
            <select name="mode" class="form-control" required>
                <option value="" disabled selected>-- Select Security Mode --</option>
                <option value="Light">Light</option>
                <option value="Balanced">Balanced</option>
                <option value="Extreme">Extreme</option>
            </select>
        </div>

        <button class="btn btn-primary">Encrypt Image</button>
    </form>

    <div class="mt-3 text-center">
        <a href="/decrypt" class="btn btn-warning">Go to Decryption</a>
        <a href="/records" class="btn btn-success">View Database Records</a>
    </div>
</div>

</body>
</html>
